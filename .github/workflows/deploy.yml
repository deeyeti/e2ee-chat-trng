name: CI / Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow only one concurrent deployment to Pages
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # needed to push tags
  pages: write           # needed to deploy to Pages
  id-token: write        # needed for OIDC token (pages deploy)

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Lint & Validate
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Validate HTML structure
        run: |
          # Check that index.html exists and has required elements
          echo "Validating index.html..."
          grep -q '<title>' index.html       && echo "✓ title tag found"
          grep -q '<meta name="description"' index.html && echo "✓ meta description found"
          grep -q 'type="module"' index.html && echo "✓ ES module script found"
          grep -q 'id="app"' index.html      && echo "✓ #app root found"
          echo "HTML validation passed."

      - name: Check for storage API usage (zero-knowledge policy)
        run: |
          echo "Checking zero-knowledge policy..."
          # Fail if any JS file uses localStorage or sessionStorage
          if grep -rn "localStorage\|sessionStorage\|indexedDB" js/ ; then
            echo "❌ VIOLATION: Storage API found in JS files — violates zero-knowledge policy"
            exit 1
          fi
          echo "✓ No storage API usage found."

  # ─────────────────────────────────────────────────────────────
  # Job 2: Semantic Version Tag (main branch only)
  # ─────────────────────────────────────────────────────────────
  tag:
    name: Create Version Tag
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      new_tag: ${{ steps.tag_action.outputs.new_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_action
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: 'v'

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_action.outputs.new_tag }}
          name: SecureLink ${{ steps.tag_action.outputs.new_tag }}
          body: |
            ## SecureLink ${{ steps.tag_action.outputs.new_tag }}

            **Changelog:**
            ${{ steps.tag_action.outputs.changelog }}

            ---
            🔐 **Deployed to**: https://${{ github.repository_owner }}.github.io/e2ee-chat-trng
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # Job 3: Deploy to GitHub Pages
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [lint, tag]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload static files as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repo root (all static files)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployment URL
        run: |
          echo "✅ Deployed to: ${{ steps.deployment.outputs.page_url }}"
